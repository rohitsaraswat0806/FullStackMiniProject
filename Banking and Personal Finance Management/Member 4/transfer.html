<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BankEase - Transfer Money</title>
    <link rel="stylesheet" href="member_4.css">
</head>
<body>
<header>
    <div class="logo">BankEase</div>
    <nav>
        <a href="../Member 1/index.html">Dashboard</a>
        <a href="../Member 1/accounts.html">Accounts</a>
        <a href="../Member 2/transactions.html">Transactions</a>
        <a href="../Member 3/finance.html">Finance</a>
        <a href="../Member 4/transfer.html">Transfer</a>
        <a href="../Member 4/profile.html">Profile</a>
    </nav>
</header>

<main class="container">
    <h1 class="section-title">Transfer Money</h1>

    <div class="form-box">
        <form>
            <div class="form-group">
                <label>From Account</label>
                <select>
                    <option>Savings Account - XXXX 4582</option>
                    <option>Current Account - XXXX 7821</option>
                </select>
            </div>

            <div class="form-group">
                <label>Receiver Name</label>
                <input type="text" placeholder="Enter receiver name">
            </div>

            <div class="form-group">
                <label>Account Number</label>
                <input type="text" placeholder="Enter account number">
            </div>

            <div class="form-group">
                <label>Amount</label>
                <input type="number" placeholder="Enter amount">
            </div>

            <div class="form-group">
                <label>Remarks</label>
                <textarea rows="4" placeholder="Enter remarks"></textarea>
            </div>

            <button class="btn" type="submit">Transfer Money</button>
        </form>
        <p style="margin-top:15px;color:#777;">Demo form: no real transaction is performed.</p>
    </div>
</main>

<footer>© 2026 BankEase</footer>
</body>
</html>
